[package]
name = "pebblepot"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16"
axum = "0.8"
futures-util = "0.3"
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
rusqlite_migration = "2.6"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-rusqlite = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
tower-http = { version = "0.7", features = ["csrf"] }

[dev-dependencies]
http-body-util = "0.1"
scraper = "0.27.0"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
