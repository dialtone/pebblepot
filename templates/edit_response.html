{%- for section in sections %}
<div class="rows" id="rows-{{ section.key }}" hx-swap-oob="true">
  {%- for item in section.items %}
  {% include "row.html" %}
  {%- endfor %}
  {%- if section.items.is_empty() %}
  <p class="empty" data-empty>No jobs match.</p>
  {%- endif %}
</div>
{%- endfor %}
{%- if close_sheet %}
<div id="sheet" hx-swap-oob="true"></div>
{%- endif %}
{%- if let Some(toast) = toast %}
{% include "toast.html" %}
{%- endif %}
